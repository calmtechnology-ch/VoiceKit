[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Iinclude
    -I../../include
    -I../../src
lib_extra_dirs =
    ../../..
lib_deps =
    m5stack/M5Unified@^0.2.23
