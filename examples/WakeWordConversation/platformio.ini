[env:m5stack-cores3]
platform = espressif32@6.9.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = m5stack-cores3
framework = arduino
lib_ldf_mode = deep
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_port = COM4
upload_speed = 460800
board_build.partitions = no_ota.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_M5STACK_CORES3=1
    -DVOXCORE_AUDIO_MODE=2
    -DVOICEKIT_ENABLE_WAKENET=1
    -Iinclude
    -I../../src/esp_sr/include
    -L../../src/esp_sr/lib/esp32s3
    -lesp_sr_wakenet_s3
lib_deps =
    m5stack/M5CoreS3@1.0.0
    m5stack/M5Unified@0.2.23
    symlink://../..
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.4.1

