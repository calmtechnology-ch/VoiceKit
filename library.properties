name=VoiceKit
version=0.6.5.1
author=Philippe AD
maintainer=Philippe AD
sentence=Framework vocal multi-fournisseurs (Google Gemini Live & OpenAI Realtime) pour M5Stack CoreS3 avec Pipeline Vocal Integre Stabilise (IntegratedVoicePipeline v0.6.5.1), Routeur de Commandes Locales (VoiceCommandDispatcher), Pont Vocal Temps Reel (VoiceUxLiveBridge), Fondation Voice UX locale (VoiceUxController), Registre Local d'Outils securise (ToolRegistry), synthese vocale (TTS), reconnaissance vocale (STT), dictee continue (ContinuousSTT), conversation bidirectionnelle et moteur audio VoxCore stabilise — v0.6.5.1.
paragraph=Bibliotheque C++/Arduino pour M5Stack CoreS3 avec pipeline vocal integre stabilise IntegratedVoicePipeline v0.6.5.1 (orchestration complete Activation -> STT -> Decision -> Tool/IA -> TTS -> READY, machine a etats explicite a 12 etats, correlation asynchrone absolue par turnId, protection anti-double execution, gestion du cycle IA complet, securisation de speakOutput et des demarrages TTS, idempotence stricte de finishTurn, pause/reprise effectives et memoire unifiee ReplyMemory), routeur de commandes VoiceCommandDispatcher (normalisation UTF-8 francais et extraction de parametres robustes avec detection de negations), fondation Voice UX locale v0.6.4.1 (filtrage deterministe TextGate, routeur d'intentions francaises VoiceIntentRouter, memoire conversationnelle ReplyMemory bornee a 5 reponses en RAM, facade unifiee VoiceUxController 100% hors ligne), infrastructure de commandes locales ToolRegistry v0.6.4.3.1 (invalidation stricte des jetons et generation de definition d'outil pour interdire la reutilisation de jetons apres reenregistrement), architecture multi-fournisseurs unifiee (IVoiceProvider, Gemini Live par defaut, OpenAI Realtime), fondation locale de detection de mot de reveil hors ligne, controleur de conversation mains libres multi-tours, et conservation integrale du moteur audio VoxCore.

category=Audio
