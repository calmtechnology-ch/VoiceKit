sentence=Framework vocal multi-fournisseurs (Google Gemini Live & OpenAI Realtime) pour M5Stack CoreS3 avec Pont Vocal Temps Reel fiabilise (Voice UX Live Bridge v0.6.4.3), Fondation Voice UX locale (Voice UX Foundation v0.6.4.1), Registre Local d'Outils securise (Local Tool Registry v0.6.4.3), synthese vocale (TTS), reconnaissance vocale (STT), dictee continue (ContinuousSTT), conversation bidirectionnelle, fondation Wake Word locale hors ligne stabilisee, conversation mains libres declenchee par « Bonjour ESP » (WakeWordConversationController, WakeNet configurable) et moteur audio VoxCore stabilise — v0.6.4.3.
paragraph=Bibliotheque C++/Arduino pour M5Stack CoreS3 avec pont vocal temps reel VoiceUxLiveBridge v0.6.4.3 (cycle de vie des metadonnées TTS preserve, machine a etats sans blocage, statut d'action et synchronisation PTT a source unique de verite), fondation Voice UX locale v0.6.4.1 (filtrage deterministe TextGate, routeur d'intentions francaises VoiceIntentRouter, memoire conversationnelle ReplyMemory bornee a 5 reponses en RAM, facade unifiee VoiceUxController 100% hors ligne), infrastructure de commandes locales ToolRegistry v0.6.4.3 (jeton de confirmation strict et immuable, revalidation des autorisations, protection anti-rejeu et file bornee, execution differee coopérative), architecture multi-fournisseurs unifiee (IVoiceProvider, Gemini Live par defaut, OpenAI Realtime), fondation locale de detection de mot de reveil hors ligne (WakeWordManager, IWakeWordEngine, WakeWordAudioBridge, TestWakeWordEngine, WakeNetEngine), controleur de conversation mains libres multi-tours (WakeWordConversationController), conservation integrale du moteur audio VoxCore (Mode 2 DEDICATED_AUDIO_TASK, buffer PSRAM 120 000 echantillons, DMA, vidage exact sans coupure finale), connexion rapide FastConnect, metriques de latence et facade VoiceKit.

