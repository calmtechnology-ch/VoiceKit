sentence=Bibliotheque vocale C++17 multi-fournisseurs (Google Gemini Live & OpenAI Realtime) pour M5Stack CoreS3 — v0.6.7.2 (Public Release & Easy Onboarding).
paragraph=Bibliotheque C++17/Arduino pour M5Stack CoreS3 permettant de creer des applications vocales temps reel avec Google Gemini Live ou OpenAI Realtime : synthese vocale TTS 24 kHz, reconnaissance vocale STT, conversation bidirectionnelle, Push-to-Talk 2 clics et validation VAD (VoiceInteractionController & VoiceCaptureValidator), STOP prioritaire, profils vocaux multilingues NVS, commandes locales securisees (ToolRegistry) et mot de reveil hors ligne (WakeNet).

