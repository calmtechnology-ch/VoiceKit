sentence=Framework vocal multi-fournisseurs (Google Gemini Live & OpenAI Realtime) pour M5Stack CoreS3 avec Fondation Voice UX locale (Voice UX Foundation v0.6.4.1), Registre Local d'Outils (Local Tool Registry v0.6.4), synthese vocale (TTS), reconnaissance vocale (STT), dictee continue (ContinuousSTT), conversation bidirectionnelle, fondation Wake Word locale hors ligne stabilisee, conversation mains libres declenchee par « Bonjour ESP » (WakeWordConversationController, WakeNet configurable) et moteur audio VoxCore stabilise — v0.6.4.1.
paragraph=Bibliotheque C++/Arduino pour M5Stack CoreS3 avec fondation Voice UX locale v0.6.4.1 (filtrage deterministe TextGate, routeur d'intentions francaises VoiceIntentRouter, memoire conversationnelle ReplyMemory bornee a 5 reponses en RAM, facade unifiee VoiceUxController 100% hors ligne), infrastructure de commandes locales ToolRegistry v0.6.4 (enregistrement type, validation de bornes, securite 3 niveaux, confirmation anti-rejeu, gestion d'evenements, sans Wi-Fi ni IA requise), architecture multi-fournisseurs unifiee (IVoiceProvider, Gemini Live par defaut, OpenAI Realtime), fondation locale de detection de mot de reveil hors ligne (WakeWordManager, IWakeWordEngine, WakeWordAudioBridge, TestWakeWordEngine, WakeNetEngine), controleur de conversation mains libres multi-tours (WakeWordConversationController), conservation integrale du moteur audio VoxCore (Mode 2 DEDICATED_AUDIO_TASK, buffer PSRAM 120 000 echantillons, DMA, vidage exact sans coupure finale), connexion rapide FastConnect, metriques de latence et facade VoiceKit.

