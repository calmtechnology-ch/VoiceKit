[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@6.9.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = m5stack-cores3
framework = arduino
lib_ldf_mode = deep
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_M5STACK_CORES3=1
    -DVOXCORE_AUDIO_MODE=2
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
lib_deps =
    m5stack/M5CoreS3@1.0.0
    m5stack/M5Unified@0.2.23
    lvgl/lvgl@9.2.2
    symlink://../..

; =============================================================================
; Variantes préconfigurées (Langue FR/EN x Fournisseur Gemini/OpenAI)
; VC_AI_PROVIDER : 1 = VC_PROVIDER_OPENAI, 2 = VC_PROVIDER_GEMINI
; =============================================================================
[env:fr-gemini]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    '-DVC_LANGUAGE="fr"'
    -DVC_AI_PROVIDER=2

[env:fr-openai]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    '-DVC_LANGUAGE="fr"'
    -DVC_AI_PROVIDER=1

[env:en-gemini]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    '-DVC_LANGUAGE="en"'
    -DVC_AI_PROVIDER=2

[env:en-openai]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    '-DVC_LANGUAGE="en"'
    -DVC_AI_PROVIDER=1
