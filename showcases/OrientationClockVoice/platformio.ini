[env:m5stack-cores3]
; Latest PlatformIO release that keeps the Arduino-ESP32 2.0.17 API used by VoiceKit.
platform = espressif32@7.1.3
board = m5stack-cores3
framework = arduino
lib_ldf_mode = deep
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_M5STACK_CORES3=1
    -DVOXCORE_AUDIO_MODE=2
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps = 
    m5stack/M5CoreS3@1.0.1
    ; Keep the 0.2.x graphics API: M5Unified/M5GFX 0.3 changes CoreS3 rotation semantics.
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    lvgl/lvgl@9.6.0
    symlink://../..
